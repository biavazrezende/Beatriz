<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>AmorSaúde — Organograma</title>
    <!--
      GitHub Pages SPA redirect trick (github.com/rafgraph/spa-github-pages).
      Quando o GitHub Pages não encontra uma rota (ex: /sistema-organograma/admin),
      serve este 404.html. O script abaixo redireciona para index.html
      preservando o caminho original como query string, que o script em
      index.html reconstrói via history.replaceState antes do React montar.
    -->
    <script>
      var segmentsToKeep = 1 // mantém "/sistema-organograma"
      var l = window.location
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(segmentsToKeep).join('/')
          .replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      )
    </script>
  </head>
  <body></body>
</html>
